name: Validar y empaquetar Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:native
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run package:win
      - name: Comprimir aplicación portable
        shell: pwsh
        run: Compress-Archive -Path dist/NEXO-win32-x64 -DestinationPath dist/NEXO-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NEXO-Windows-x64
          path: dist/NEXO-Windows-x64.zip
          if-no-files-found: error

  release:
    name: Publicar descarga de prueba
    needs: windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NEXO-Windows-x64
          path: release
      - name: Publicar ZIP como prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: preview-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/NEXO-Windows-x64.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/NEXO-Windows-x64.zip \
              --target "$GITHUB_SHA" \
              --title "NEXO 0.3.0 - Prueba para Windows" \
              --prerelease \
              --notes "Descomprime la carpeta completa y abre NEXO.exe. Version 0.3.0: nuevo hub y logos locales, perfiles GPU por juego, pestaña Laptop y compatibilidad exclusiva con Windows 10/11. Sin firma digital. Los ajustes de energia se restauran desde Historial; cerrar la aplicacion no los restaura. Esta publicacion requiere que pasen las pruebas de logica, interfaz y las comprobaciones nativas de Windows del workflow. No demuestra un aumento de FPS en tu equipo."
          fi
